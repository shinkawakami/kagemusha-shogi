spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kagemusha}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# スキーマは Flyway が管理する。Hibernate は検証のみ行う。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway（デフォルトで classpath:db/migration を読み、起動時に適用）
spring.flyway.enabled=true

# フロントエンドのオリジン（REST/WebSocket共通）
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}

# 放置対局の削除
# abandoned-ttl: 終局していない対局を、最終更新からこの期間放置されたら削除対象にする（ISO-8601 Duration）
# cleanup-cron: 削除ジョブの実行スケジュール（Spring cron・秒 分 時 日 月 曜。既定は毎正時）
app.game.abandoned-ttl=${APP_GAME_ABANDONED_TTL:PT24H}
app.game.cleanup-cron=${APP_GAME_CLEANUP_CRON:0 0 * * * *}