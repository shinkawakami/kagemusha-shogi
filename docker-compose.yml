services:
  db:
    image: postgres:16
    container_name: kagemusha-db
    environment:
      POSTGRES_DB: kagemusha
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d kagemusha"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: ./backend
      target: dev
    container_name: kagemusha-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/kagemusha
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: pass
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - maven-cache:/root/.m2
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: kagemusha-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
  adminer:
    image: adminer:5.4.2
    container_name: kagemusha-adminer
    ports:
      - "8090:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
volumes:
  db-data:
  maven-cache:
